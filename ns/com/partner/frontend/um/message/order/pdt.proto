message com_partner_frontend_um_message_order {
optional  string id = 1;
optional  string item = 2;
optional  string quantity = 3;
optional  string VATNumber = 4;
optional  com_partner_frontend_um_message_order_Contact Contact = 5;
optional  com_partner_frontend_um_message_order_Price Price = 6;
optional  pub_publish_envelope _env = 536870910;
}
message com_partner_frontend_um_message_order_Contact {
optional  string customer_name = 1;
optional  string contact_name = 2;
optional  string contact_mail = 3;
optional  string contact_number = 4;
}
message com_partner_frontend_um_message_order_Price {
optional  string unit_price = 1;
optional  string total_price = 2;
}
message pub_publish_envelope {
